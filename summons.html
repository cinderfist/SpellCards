<!DOCTYPE html>
<html>

<head>
    <title>Summoning Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
 <style>
      body {
    font-family: Metamorphous, cursive;
    margin: 20px;
    text-align: center;

    background-image: url("background/Blkpch.jpeg");
    background-size: cover;
    background-attachment: fixed;
            }
      h1 { font-family: "Metamorphous", cursive;
          color:#FFD700 ;
          font-size: 36px;}
     h2 { color:#FFD700 ; font-size: 18px;}

#spell-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 600px;
    margin: auto;
    padding: 10px;
             }
.spell-button {
    background-color: #d8c39a;
    border: 2px solid #5b4636;
    border-radius: 8px;
    padding: 10px;
    font-family: Metamorphous, serif;
    font-size: 16px;
    color: #2b1b0f;
    cursor: pointer;
              }
.spell-button:hover {
    background-color: #e8d3a8;
    transform: scale(1.05); }
.summon-header {
    grid-column: 1 / -1;
    margin-top: 30px;
    font-size: 32px;
    color: #f5e6c8;
    text-shadow: 2px 2px 4px #000;
               }     
 </style>

</head>
<body>
<h1>Summoning Cards</h1>
<div id="spell-card">
   <h2> Select a spell to view the card.</h2>
</div>
<div id="spell-list">
    Loading spells...
</div>
<hr>

<script src="summons.js"></script>

</body>
</html>
