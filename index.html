<!DOCTYPE html>
<html>
<head>
    <title>Spell Cards</title>
</head>
<body>
<div id="spell-list">
    Loading spells...
</div>
<hr>

<div id="spell-card">
    Select a spell to view the card.
</div>
<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTizAGyLQWLge0LKAxoXBVAmF2qy3nWJRRZyGY5Z7Vi5vWJ8WFAwNppX0bPl8ESXp84QFbfwZaMtxK0/pub?gid=0&single=true&output=csv";

fetch(sheetURL)
    .then(response => response.text())
    .then(data => {

        let rows = data.split("\n");

        let output = "<ul>";

        for (let i = 1; i < rows.length; i++) {

            let columns = rows[i].split(",");

            if (columns[0]) {
     output += "<li><button class='spell-button' data-name='" 
        + columns[0] 
        + "' data-image='" 
        + columns[3] 
        + "'>" 
        + columns[0] 
        + "</button></li>";

}
        }

        output += "</ul>";

        document.getElementById("spell-list").innerHTML = output;

document.addEventListener("click", function(event) {

    if (event.target.classList.contains("spell-button")) {

        let spellName = event.target.dataset.name;
        let image = event.target.dataset.image;
        console.log("Spell clicked:", spellName);
        console.log("Image value:", image);
        document.getElementById("spell-card").innerHTML =
            "<h2>" + spellName + "</h2>" +
            "<img src='" + image + "' width='400'>";
    
}
    });

</script>
</body>
</html>
