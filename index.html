<!DOCTYPE html>
<html>

<head>
    <title>Spell Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp:wght@700&display=swap" rel="stylesheet">
 <style>
      body {
    font-family: Georgia, serif;
    margin: 20px;
    text-align: center;

    background-image: url("background/Blkpch.jpeg");
    background-size: cover;
    background-attachment: fixed;
            }
      h1 { font-family: "MedievalSharp", serif;
          color:#FFD700 ;
          font-size: 36px;}
     h2 { color:#FFD700 ; font-size: 18px;}

#spell-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 600px;
    margin: auto;
    padding: 10px;
             }
.spell-button {
    background-color: rgba(255, 255, 255, 0.75);
    border: 2px solid #444;
    border-radius: 8px;
    padding: 10px;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
              }
.spell-button:hover { transform: scale(1.05); }
 </style>

</head>
<body>
<h1>Spell Cards</h1>
<div id="spell-card">
   <h2> Select a spell to view the card.</h2>
</div>
<div id="spell-list">
    Loading spells...
</div>
<hr>

<script src="app.js"></script>

</body>
</html>
