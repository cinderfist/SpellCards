<!DOCTYPE html>
<html>

<head>
    <title>Spell Cards</title>

 <style>
      body {
    font-family: Georgia, serif;
    margin: 20px;
    text-align: center;

    background-image: url("background/Blkpch.jpeg");
    background-size: cover;
    background-attachment: fixed;
            }
      h1 {    font-size: 36px;}
#spell-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    max-width: 900px;
    margin: auto;
    padding: 20px;
             }
.spell-button {
    background-color: rgba(255, 255, 255, 0.75);
    border: 2px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-family: Georgia, serif;
    font-size: 18px;
    cursor: pointer;
              }
.spell-button:hover { transform: scale(1.05); }
 </style>

</head>
<body>
<h1>Spell Cards</h1>
<div id="spell-list">
    Loading spells...
</div>
<hr>
<div id="spell-card">
    Select a spell to view the card.
</div>

<script src="app.js"></script>

</body>
</html>
