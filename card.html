<!DOCTYPE html>
<html>

<head>
    <title>Spell Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: Metamorphous, sans-serif;
            text-align: center;
            margin: 20px;
            background-image: url("background/Blkpch.jpeg");
            background-size: cover;
            background-attachment: fixed;
            color:#f5e6c8;
             }

        img {
            max-width: 100%;
            height: auto;
            }

        button {
             background-color: #d8c39a;
             border: 2px solid #5b4636;
             border-radius: 8px;
             padding: 10px 20px;
    font-family: "Metamorphous", cursive;
    font-size: 18px;
    color: #2b1b0f;
    cursor: pointer;
               }

    </style>

</head>

<body>

<button onclick="goBack()">← Back</button>

<h1 id="spell-name">     Spell     </h1>

<img id="spell-image">

<script>

const params = new URLSearchParams(window.location.search);
const spellName = params.get("name");
const image = params.get("image");


document.getElementById("spell-name").innerHTML = spellName;
document.getElementById("spell-image").src = image;


function goBack() {
    window.history.back();
}

</script>
</body>
</html>
